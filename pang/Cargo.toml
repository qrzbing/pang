[package]
name = "pang"
version.workspace = true
edition = "2024"
authors = ["qrzbing <qrzbingfoxmail.com>"]
description = "A parser and generator generator."
license.workspace = true
repository.workspace = true

[lib]
name = "pang"
path = "src/lib.rs"

[dependencies]
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1.0.140"
typetag = "0.2.20"

pang_derive = { workspace = true, optional = true }

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[features]
derive = ["dep:pang_derive"]

[dev-dependencies]
pang = { path = ".", features = ["derive"] }
nom = "8.0.0"
hex = "0.4.3"