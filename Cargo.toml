[workspace]
members = [
    "pang",
    "pang_libafl",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qrzbing/pang/"
readme = "./README.md"

[workspace.dependencies]
pang = { path = "pang", version = "0.1.2" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
